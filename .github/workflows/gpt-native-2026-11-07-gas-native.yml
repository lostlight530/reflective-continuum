name: GPT Native 2026-11-07 GAS native evidence
on:
  push:
    branches:
      - gpt-native/2026-11-07-gas-r1-r2
permissions:
  contents: read
jobs:
  gas-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2cbbd11710cb45efadb2b7980861740784b0ef6b
          persist-credentials: false
      - name: Native environment and pinned revision
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
      - name: R1 fixed-fixture convergence
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 CODE/tasks/convergence_drill.py
      - name: R1 original-source candidate ingestion bounded
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          signals=[
            {"id":"github_google_adk_waiting_replay_20261107","content":"Verified source commit ba142cf8e91b045aa0b435f71dbd7c3e686efa45: waiting wait_for_output node replay may repeat a consumed trigger; a rerun_on_resume node or agent waiting on user behaves differently. This is source code evidence, not GAS graph truth.","edges":[]},
            {"id":"arxiv_2607_02599v1","content":"AgentLTL Laïla Elkoussy and Julien Perez arXiv:2607.02599v1 reports FO-LTL constraints for offline trace scoring and online prefix enforcement. Compliance and final answer correctness differ; author paper is research claim not local graph validation.","edges":[]}
          ]
          with open('/tmp/gpt-native-20261107-gas-signals.json','w') as f:json.dump(signals,f)
          PY
          set +e
          PYTHONPATH=. python3 CODE/tasks/insight_morpher.py /tmp/gpt-native-20261107-gas-signals.json
          code=$?
          set -e
          echo "R1_MORPH_COMMAND_EXIT=$code"
          echo "R1_MORPH_SCOPE=isolated_process_local_store; evidence of rejection must be retained"
          test "$code" -eq 0 -o "$code" -eq 1
      - name: R2 native selfcheck
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 CODE/tasks/cortex_selfcheck.py
      - name: R2 native tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest discover tests/ -v
      - name: No tracked worktree writes
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"
