name: GPT Governance exact research allowlist regression
on:
  push:
    branches:
      - gpt-governance/2026-11-07-scope-guard-research-allow
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  guard-contract-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gpt-governance/2026-11-07-scope-guard-research-allow
          persist-credentials: false
          fetch-depth: 0
      - name: Run scope guard regression and full native unit suite
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          python3 -m unittest tests.test_scope_guard -v
          python3 -m unittest discover tests/ -v
      - name: Validate governance branch diff against actual main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2cbbd11710cb45efadb2b7980861740784b0ef6b HEAD
          python3 scope_guard.py --base-ref 2cbbd11710cb45efadb2b7980861740784b0ef6b
          python3 - <<'PY'
          from scope_guard import blocked_paths
          p1='RESEARCH/daily/2026-11-07-dehydrated-report.md'
          p2='RESEARCH/daily/2026-11-07-cortex-selfcheck.md'
          assert blocked_paths([p1,p2],{p1,p2})==[]
          assert blocked_paths([p1,p2],{p1})==[p2]
          assert blocked_paths(['README.md','RESEARCH/monthly/x.md'],{p1})==['README.md','RESEARCH/monthly/x.md']
          print('GUARD_REGRESSION_EXACT_ALLOW_WITH_DEFAULT_DENY_PASS')
          PY
      - name: Inspect test-worktree residue
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"
