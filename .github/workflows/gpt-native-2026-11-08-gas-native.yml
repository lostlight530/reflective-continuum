name: GPT Native 2026-11-08 GAS independent pinned runtime
on:
  push:
    branches:
      - gpt-native/2026-11-08-gas-r1-r2
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'
jobs:
  gas-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b76a4294a6b80edf8ce48f7b162781873b3405ca
          persist-credentials: false
          fetch-depth: 0
      - name: R1 pinned source and environment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
      - name: R1 convergence fixed-fixture
        run: |
          set -euo pipefail
          python3 CODE/tasks/convergence_drill.py
      - name: R1 canonical external candidates to process-local Morpher
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='/tmp/gpt-native-20261108-gas-signals.json'
          s=[
            {"id":"github_google_adk_unary_finish_20261108","content":"Original google/adk-python commit 1cb926d5b8d702261ec82a26d3f1c4296e0db7d7 (2026-11-08) changes unary A2A finish_task argument extraction from task history metadata. Authored tests inspected, NOT_EXECUTED; source-level observation only.","edges":[]},
            {"id":"arxiv_2608_03609v1","content":"Alejandro J. Mercado and Alessio Lomuscio, arXiv:2608.03609v1, STEAD relational FO-CTL verification. Finite abstraction requires bounded active relational state and equivariant tool, agent and transition semantics. Author's case refutes refund authorization safety and supports progress; no GAS runtime mapping proved.","edges":[]}
          ]
          with open(p,'w',encoding='utf-8') as f:json.dump(s,f,ensure_ascii=False)
          print('R1_INPUT',json.dumps({"path":p,"ids":[x["id"] for x in s],"n":len(s)},ensure_ascii=False))
          PY
          python3 CODE/tasks/insight_morpher.py /tmp/gpt-native-20261108-gas-signals.json
      - name: R1 readonly checkout hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
  gas-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b76a4294a6b80edf8ce48f7b162781873b3405ca
          persist-credentials: false
          fetch-depth: 0
      - name: R2 pinned source and environment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
      - name: R2 independent Cortex Selfcheck
        run: |
          set -euo pipefail
          python3 CODE/tasks/cortex_selfcheck.py
      - name: R2 native test suite
        run: |
          set -euo pipefail
          python3 -m unittest discover tests/ -v
      - name: R2 readonly checkout hygiene
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
