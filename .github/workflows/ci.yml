name: Verify reflective contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q CODE tests scope_guard.py
      - name: Protected-path gate
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'scope:approved-readme') }}" == "true" ]]; then
            python scope_guard.py --base-ref "${{ github.event.pull_request.base.sha }}" --allow-file README.md
          else
            python scope_guard.py --base-ref "${{ github.event.pull_request.base.sha }}"
          fi
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Observable selfcheck
        run: python -m CODE.tasks.cortex_selfcheck
      - name: Bounded repeatability drill
        run: python -m CODE.tasks.convergence_drill --iterations 100