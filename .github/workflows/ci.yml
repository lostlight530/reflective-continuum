name: Verify reflective contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q CODE tests scope_guard.py
      - name: Protected-path gate
        if: github.event_name == 'pull_request'
        run: python scope_guard.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Observable selfcheck
        run: python -m CODE.tasks.cortex_selfcheck
      - name: Bounded repeatability drill
        run: python -m CODE.tasks.convergence_drill --iterations 100