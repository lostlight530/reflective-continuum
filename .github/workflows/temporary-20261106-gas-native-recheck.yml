name: Temporary 2026-11-06 GAS PR-branch final verification
on:
  push:
    branches: [independent/20261106-gas-native-blocked-gpt6]
permissions:
  contents: read
jobs:
  r1-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fresh exact main worktree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: independent/20261106-gas-native-blocked-gpt6
          persist-credentials: false
          clean: true
      - name: Pin runtime and inputs
        run: |
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "PYTHON=$(python3 --version)"
          sha256sum CODE/tasks/convergence_drill.py CODE/tasks/insight_morpher.py
      - name: R1 native convergence gate once
        run: |
          set -o pipefail
          PYTHONPATH=. python3 CODE/tasks/convergence_drill.py | tee -a ingestion.log
      - name: R1 exactly three source-bounded signals
        run: |
          cat > /tmp/20261106-signals.json <<'JSON'
          [
            {"id":"arxiv_2610_16865v2","content":"Author-paper candidate: controller-agnostic reach-avoid shield risk bound requires a specified Markov state abstraction, successor coverage and controllers obeying the filter; no local implementation inferred.","edges":[]},
            {"id":"arxiv_2605_09045v2","content":"Author-paper candidate: containment proof constrains boundary-enforceable typed action effects under a modelled havoc-oracle and refinement boundary; not general correctness of a deployed host.","edges":[]},
            {"id":"arxiv_2607_02599v1","content":"Author-paper candidate: AgentLTL describes deterministic trace-based procedural constraints and online prefix gating distinct from final-answer correctness; no local policy engine proof inferred.","edges":[]}
          ]
          JSON
          python3 -m json.tool /tmp/20261106-signals.json > /dev/null
          printf '%s\n' 'SOURCE_A arxiv:2610.16865v2 https://arxiv.org/abs/2610.16865'
          printf '%s\n' 'SOURCE_B arxiv:2605.09045v2 https://arxiv.org/abs/2605.09045'
          printf '%s\n' 'SOURCE_C arxiv:2607.02599v1 https://arxiv.org/abs/2607.02599'
          set +e
          PYTHONPATH=. python3 CODE/tasks/insight_morpher.py /tmp/20261106-signals.json > /tmp/20261106-morph-result.json 2>/tmp/20261106-morph-error.log
          morph_exit=$?
          set -e
          echo "MORPH_EXIT=$morph_exit"
          cat /tmp/20261106-morph-result.json | tee -a ingestion.log
          cat /tmp/20261106-morph-error.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/20261106-morph-result.json").read_text())
          assert report["total"] == 3
          rejected = [x for x in report["results"] if not x["accepted"]]
          for item in rejected:
              receipt = {"event":"HARD_ROLLBACK", "signal_id":item["id"],
                         "reasons":item["reasons"],"graph_write_status":"REJECTED_NOT_PERSISTED",
                         "retry":"NOT_ATTEMPTED"}
              print("R1_REJECTION="+json.dumps(receipt,sort_keys=True))
              with Path("ingestion.log").open("a",encoding="utf-8") as log:
                  log.write("HARD_ROLLBACK "+json.dumps(receipt,sort_keys=True)+"\n")
          print("R1_NATIVE_SUMMARY="+json.dumps({"input":3,"accepted":report["accepted"],
                     "rejected":len(rejected),
                     "database":"process-local :memory:; not a persistent cross-job store"},sort_keys=True))
          PY
      - name: Restore ephemeral log write and verify bounded scope
        if: always()
        run: |
          git diff --stat
          git restore -- ingestion.log
          git status --porcelain
          test -z "$(git status --porcelain)"
  r2-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fresh exact main worktree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: independent/20261106-gas-native-blocked-gpt6
          persist-credentials: false
          clean: true
      - name: Record runtime identity
        run: |
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "PYTHON=$(python3 --version)"
          sha256sum CODE/tasks/cortex_selfcheck.py
      - name: R2 native cortex selfcheck
        run: PYTHONPATH=. python3 CODE/tasks/cortex_selfcheck.py
      - name: R2 native test suite
        run: PYTHONPATH=. python3 -m unittest discover tests/ -v
      - name: Validate canonical Daily and append-only R1 receipts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("2026-11-06-dehydrated-report.md", "2026-11-06-cortex-selfcheck.md"):
              file = Path("RESEARCH/daily")/name
              assert file.is_file(), name
              text = file.read_text(encoding="utf-8")
              assert "42138511703" in text and "SAME-DATE" in text, name
          log = Path("ingestion.log").read_text(encoding="utf-8")
          assert log.count("2026-11-06;GAS_NATIVE_R1;https://github.com/lostlight530/reflective-continuum/actions/runs/42138511703") == 1
          assert 'arxiv_2607_02599v1' in log
          print("GAS_BRANCH_ARTIFACTS=PASS; original R1 rejection and R2 bounded selfcheck retained")
          PY
      - name: Final read-only boundary
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
