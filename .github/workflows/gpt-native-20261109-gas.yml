name: GPT Native 2026-11-09 GAS bounded shared-store verification
on:
  push:
    branches:
      - gpt-native/gas-daily-20261109
permissions:
  contents: read
jobs:
  gas-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fresh exact pinned main checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 643f11ff66fb3972b0ed1c71a1127841401e5d3d
          persist-credentials: false
      - name: Record source and environment
        run: |
          git rev-parse HEAD
          python3 --version
          git status --porcelain
      - name: R1 fixed-fixture convergence
        run: PYTHONPATH=. python3 CODE/tasks/convergence_drill.py
      - name: R1 actual InsightMorpher into named temporary SQLite file
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import json,hashlib,os,pathlib
          from CODE.tasks.insight_morpher import InsightMorpher
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"gas-native-20261109.sqlite3"
          assert not p.exists(), "fresh runner store precondition"
          source=[
            {"id":"arxiv_2607_27267v1","content":"FAVA version 1, first-party arXiv paper originally submitted 2026-07-29. Permission IR and SMT graph claims are author-reported not independently proven.","edges":[]},
            {"id":"github_agents_8ea4333_guardrail","content":"OpenAI Agents SDK first-party code patch 8ea4333 dated 2026-11-09. Stream retry guardrail changed before subsequent model stream. Authored source tests not executed here.","edges":[]}
          ]
          inp=json.dumps(source,ensure_ascii=False,sort_keys=True)
          print("R1_INPUT_SHA256",hashlib.sha256(inp.encode()).hexdigest())
          morph=InsightMorpher(db_path=str(p))
          result=morph.morph_signals(source)
          digest=morph.db.snapshot_digest()
          counts={"nodes":morph.db.conn.execute("select count(*) from nodes").fetchone()[0],"edges":morph.db.conn.execute("select count(*) from edges").fetchone()[0]}
          morph.db.close()
          print("R1_MORPH_EVIDENCE",json.dumps(result,ensure_ascii=False,sort_keys=True))
          print("R1_GRAPH_EVIDENCE",json.dumps({"database":str(p),"snapshot_digest":digest,"counts":counts,"file_sha256":hashlib.sha256(p.read_bytes()).hexdigest()},sort_keys=True))
          assert result["accepted"]==2 and result["total"]==2 and counts["nodes"]==2
          PY
      - name: R2 independent process opens exact same named SQLite
        run: |
          GAS_DB="$RUNNER_TEMP/gas-native-20261109.sqlite3"
          echo "R2_DB_PATH=$GAS_DB"
          PYTHONPATH=. python3 CODE/tasks/cortex_selfcheck.py --database "$GAS_DB"
          PYTHONPATH=. python3 - <<'PY'
          import hashlib,os,pathlib,json
          from CODE.continuum_db import GraphDB
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"gas-native-20261109.sqlite3"
          with GraphDB(p) as db:
              nodes=db.get_all_nodes()
              digest=db.snapshot_digest()
              counts={"nodes":db.conn.execute("select count(*) from nodes").fetchone()[0],"edges":db.conn.execute("select count(*) from edges").fetchone()[0]}
          print("R2_REOPEN_EVIDENCE",json.dumps({"database":str(p),"snapshot_digest":digest,"node_ids":nodes,"counts":counts,"file_sha256":hashlib.sha256(p.read_bytes()).hexdigest()},sort_keys=True))
          assert counts["nodes"]==2 and set(nodes)=={"arxiv_2607_27267v1","github_agents_8ea4333_guardrail"}
          PY
      - name: R2 independent native unit tests
        run: PYTHONPATH=. python3 -m unittest discover tests/ -v
      - name: Final no unverified repository writes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
